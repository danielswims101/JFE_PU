  b.addEventListener('click', ()=> switchIO(b.dataset.io)));

function buildRec(){
  rec = new SR();
  rec.lang = 'en-US';
  rec.continuous = true;               /* one long session, many finals */
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = ()=>{
    recActive = true;
    clearTimeout(startWatch);
    if(standby && !handsFree){        /* asleep: listening only for a name */
      input.classList.remove('hearing');
      if(!pending && !speaking) setState('idle');
      captionHint();
      return;
    }
    if(!pending && !speaking) setState('listening');
    input.classList.add('hearing');
    input.placeholder = 'LISTENING…';
  };
  rec.onresult = e=>{
    let interim = '', final = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) final += t; else interim += t;
    }
    if(interim){
      input.value = interim.trim();
      if(inputMode === 'AUTO' && liveCaption){
        liveCaption.classList.remove('hint');
        liveCaption.textContent = interim.trim();
      }
    }
    if(final){
      const t = final.trim();
      let conf = 0;
      for(let i = e.resultIndex; i < e.results.length; i++){
        if(e.results[i].isFinal && e.results[i][0]) conf = e.results[i][0].confidence || 0;
      }
      if(dictating){                    /* DICTATE: fill the box, you send */
        input.value = t;
        dictating = false;
        micBtn.classList.remove('live');
        try{ rec.stop(); }catch(_e){}
        EAR.spoke = false;
        return;
      }
      /* asleep: discard everything except a summons */
      if(standby && !handsFree){
        EAR.spoke = false;
        input.value = '';
        const w = matchWake(t);
        if(w) wakeUp(w.key, w.rest, w.alter);
        return;
      }
      const noise = isLikelyNoise(t, conf);
      EAR.spoke = false;
      if(noise){                        /* the room talking, not you */
        input.value = '';
        if(liveCaption && inputMode === 'AUTO'){
          liveCaption.textContent = '';
          captionHint();
        }
        return;
      }
      input.value = t;
      handleUtterance(t);
    }
  };
  rec.onerror = e=>{
    recActive = false;
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      standDown();
      if(inputMode === 'AUTO') setInputMode('TYPE');   /* never strand them */
      micBtn.classList.add('dead');
      addMsg('fault',
        'MICROPHONE BLOCKED — this site was denied mic access. iPhone: tap the aA in the address bar \u2192 Website Settings \u2192 Microphone \u2192 Allow, then reload. Chrome: click the padlock \u2192 Site settings \u2192 Microphone \u2192 Allow. Typing works meanwhile.');
    }
    else if(e.error === 'audio-capture'){
      standDown();
      addMsg('fault','NO MICROPHONE DETECTED \u2014 check the device\u2019s microphone and the browser\u2019s site permissions.');
    }

  };
  rec.onend = ()=>{
    recActive = false;
    input.classList.remove('hearing');
    if((handsFree || standby) && !pending && !speaking){
      restartTimer = setTimeout(startListening, standby ? 700 : 350);
    } else if(!pending && !speaking){
      setState('idle');
      input.placeholder = 'SPEAK OR TYPE';
    }
  };
}

function startListening(){
  if(!SR || (!handsFree && !standby) || recActive || pending || speaking || held) return;
  if(!EAR.armed && !EAR.denied) armEar();
  try{ rec.start(); }catch(_e){ /* already started — harmless */ }
  clearTimeout(startWatch);
  startWatch = setTimeout(()=>{
    /* Some browsers (notably iPhone Safari) silently refuse to reopen
       the mic without a fresh tap. If the session never actually

    if(handsFree && !recActive && !pending && !speaking) standDown();

function pauseListening(){
  clearTimeout(restartTimer);

  recActive = false;

function standDown(keepEar){

  micBtn.classList.remove('live');
  micBtn.classList.toggle('standby', standby);
  input.classList.remove('hearing');
  input.placeholder = 'SPEAK OR TYPE';
  if(standby){
    pauseListening();
    restartTimer = setTimeout(startListening, 400);
  }else{
    pauseListening();
  }
  captionHint();
  if(!pending && !speaking) setState('idle');
}

/* the ring wakes on hearing its name */
function wakeUp(key, rest, wantAlter){
  standby = false;
  micBtn.classList.remove('standby');
  if(wantAlter && temperament !== 'SERIOUS'){
    temperament = 'SERIOUS';
    paintMode();
    document.querySelectorAll('#tempTabs .chip').forEach(b=>
      b.classList.toggle('on', b.dataset.temp === temperament));
  }
  if(key && key !== activeKey){
    activeKey = key;
    paintMode();
    rebootFlicker();
  }
  handsFree = true;
  micBtn.classList.add('live');
  if(liveCaption){ liveCaption.textContent = ''; liveCaption.classList.remove('hint'); }
  const T = mode().USER_TITLE;
  const line = mode()._alter ? 'EDITH online. Go ahead.'
    : mode().NAME === 'FRIDAY' ? 'Right with you, ' + T + '.'
    : 'At your service, ' + T + '.';
  const body = addMsg('ai', null);
  pushHistory('assistant', line);
  deliver(body, line, ()=>{
    if(rest) handleUtterance(rest);
    else startListening();
  });
}

/* Open the ear by ourselves. Browsers grant this silently once the user
   has allowed the microphone for this site before; the very first time
   they must tap once, which is a browser security rule no page can skip. */
async function goHandsFree(silent){
  if(!SR || inputMode !== 'AUTO') return false;
  const ok = await armEar();
  if(!ok){
    if(!silent) micBtn.classList.add('dead');
    standDown();
    return false;
  }
  handsFree = true;
  micBtn.classList.add('live');
  if(liveCaption){ liveCaption.textContent = ''; liveCaption.classList.remove('hint'); }
  startListening();
  return true;
}
function autoArm(){
  if(!SR || !SETTINGS.ALWAYS_LISTEN || inputMode !== 'AUTO' || handsFree) return;
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'microphone'}).then(st=>{
      if(st.state === 'granted') goHandsFree(true);
      if(st.onchange === null) st.onchange = ()=>{ if(st.state === 'granted') goHandsFree(true); };
    }).catch(()=>{ /* Safari has no mic permission query — wait for a tap */ });
  }
}
/* one tap anywhere also arms it, so the required gesture is effortless */
function firstGestureArm(){
  if(SETTINGS.ALWAYS_LISTEN && SR && inputMode === 'AUTO' && !handsFree && !EAR.denied){
    goHandsFree(true);
  }
}
document.addEventListener('pointerdown', firstGestureArm, {once:true});
